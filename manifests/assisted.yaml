key: assisted
version: 1.0.0
tier: assisted
auth: none
surfaces:
  - key: manual_pack
    content_types: [text, image, video_link]
    spec: {title_max_chars: 300, body_max_chars: 20000, links_allowed: true}
rate_limits:
  per_connection: {requests: 1000, per_seconds: 60}
capabilities: [validate, build_assist_pack]
error_map: {}
instance_param: submit_url