key: devto
version: 1.0.0
tier: native
auth: api_key
surfaces:
  - key: article
    content_types: [text, image, video_link]
    spec: {title_max_chars: 128, body_max_chars: 65000, links_allowed: true}
rate_limits:
  per_connection: {requests: 30, per_seconds: 30}
capabilities: [validate, publish, get_status, delete, fetch_metrics]
error_map:
  "429": PLATFORM_RATE_LIMIT
  "422": PLATFORM_CONTENT_REJECTED
  "401": CONNECTION_AUTH_EXPIRED
instance_param: base_url