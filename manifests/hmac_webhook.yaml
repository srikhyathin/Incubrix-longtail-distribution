key: hmac_webhook
version: 1.0.0
tier: bridge
auth: api_key
surfaces:
  - key: webhook_event
    content_types: [text, image, video_link]
    spec: {title_max_chars: 300, body_max_chars: 50000, links_allowed: true}
rate_limits:
  per_connection: {requests: 120, per_seconds: 60}
capabilities: [validate, publish, get_status, delete]
error_map:
  "429": PLATFORM_RATE_LIMIT
  "401": CONNECTION_AUTH_EXPIRED
instance_param: webhook_url